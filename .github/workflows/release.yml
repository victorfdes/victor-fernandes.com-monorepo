name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the version commit + tags
      pull-requests: write # open/update the "Version Packages" PR
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Opens/maintains a "Version Packages" PR that applies pending changesets.
      # Publishing stays disabled until the library ships externally (no `publish` input).
      - name: Changesets
        uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          version: pnpm changeset:version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
