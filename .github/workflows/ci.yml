name: CI

on:
  # PRs into develop/main run the full suite. Direct develop pushes (git-flow
  # merges) only refresh the Lighthouse perf baseline — heavier jobs are gated
  # to pull_request via job-level `if` guards below. Feature branches never
  # match these refs, so routine commits don't consume runner minutes.
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs opt into more where needed.
permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  # CDN origin for static assets — required by the website build (astro:env). Non-secret;
  # override per-environment with the `PUBLIC_STATIC_HOST_URL` repository variable.
  PUBLIC_STATIC_HOST_URL: ${{ vars.PUBLIC_STATIC_HOST_URL || 'https://r2.victor-fernandes.com' }}
  # Optional Turbo Remote Cache — set these repo secrets/vars to enable cross-run caching.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    # Validation only needs to run on PRs; develop merges were already checked.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/setup

      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Dead code & unused deps (knip)
        run: pnpm knip
      - name: Dependency version consistency (syncpack)
        run: pnpm syncpack:check
      - name: Unit tests (with coverage)
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Validate package exports (publint)
        run: pnpm --filter @repo/ui lint:publish

  e2e:
    name: End-to-end (Playwright + axe)
    # Validation only needs to run on PRs; develop merges were already checked.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/setup

      - name: Build workspace
        run: pnpm build

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm --filter website exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Playwright (browsers + system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter website exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cached browsers)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter website exec playwright install-deps chromium

      - name: Run e2e tests
        run: pnpm --filter website e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/website/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse (100/100 budget + perf diff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # post the perf-diff comment
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/setup

      - name: Build site
        run: pnpm build

      - name: Collect & assert Lighthouse
        run: |
          pnpm dlx @lhci/cli@0.14.x collect
          pnpm dlx @lhci/cli@0.14.x assert
          pnpm dlx @lhci/cli@0.14.x upload --target=filesystem --outputDir=.lighthouseci/current
          pnpm dlx @lhci/cli@0.14.x upload --target=temporary-public-storage || true

      # develop push → persist this run as the perf baseline.
      - name: Save develop baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: cp -r .lighthouseci/current lhci-baseline
      - name: Cache develop baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: lhci-baseline
          key: lhci-baseline-develop-${{ github.sha }}

      # PR → restore the latest develop baseline and diff against it.
      - name: Restore develop baseline
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: lhci-baseline
          key: lhci-baseline-develop-
          restore-keys: |
            lhci-baseline-develop-

      - name: Performance diff vs develop
        id: lhdiff
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/lighthouse-diff.mjs lhci-baseline .lighthouseci/current

      - name: Comment perf diff on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: lighthouse-perf
          path: lighthouse-diff.md

      - name: Fail on performance regression
        if: github.event_name == 'pull_request' && steps.lhdiff.outcome == 'failure'
        run: |
          echo "::error::Lighthouse performance regressed beyond budget vs develop."
          exit 1
