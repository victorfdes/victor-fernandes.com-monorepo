name: SonarCloud

on:
  # Production `main` pushes are scanned by pages-production.yml, where the
  # quality gate blocks the Cloudflare Pages deploy hook.
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  PUBLIC_STATIC_HOST_URL: ${{ vars.PUBLIC_STATIC_HOST_URL || 'https://r2.victor-fernandes.com' }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # Promoted to env so the scan steps can guard on it — the `secrets` context is
  # not allowed in step-level `if:` conditions, but `env` is.
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Unit tests (with coverage)
        run: pnpm test

      - name: Normalize LCOV for SonarCloud
        run: pnpm coverage:sonar

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0

      - name: Skip when SONAR_TOKEN is missing
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "SONAR_TOKEN is not configured for this repository."
          echo "Skipping SonarCloud scan."
