name: SonarCloud

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  PUBLIC_STATIC_HOST_URL: ${{ vars.PUBLIC_STATIC_HOST_URL || 'https://static.victor-fernandes.com' }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Unit tests (with coverage)
        run: pnpm test

      - name: Normalize LCOV for SonarCloud
        run: pnpm coverage:sonar

      - name: SonarCloud Scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Skip when SONAR_TOKEN is missing
        if: ${{ secrets.SONAR_TOKEN == '' }}
        run: |
          echo "SONAR_TOKEN is not configured for this repository."
          echo "Skipping SonarCloud scan."
