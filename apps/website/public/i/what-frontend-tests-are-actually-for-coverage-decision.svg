<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="408" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">How a file earns a test (or doesn't)</text>

  <!-- start -->
  <rect x="290" y="50" width="180" height="44" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="380" y="77" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">A file in the codebase</text>
  <path d="M380,94 L380,110" stroke="#94a3b8" fill="none" marker-end="url(#arrow)"/>

  <!-- decision diamond -->
  <polygon points="380,112 545,168 380,224 215,168" fill="#ecfeff" stroke="#06b6d4"/>
  <text x="380" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#0e7490">Real logic that can break</text>
  <text x="380" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="#0e7490">in a way a user would feel?</text>

  <!-- branches -->
  <path d="M215,168 H150 V262" stroke="#94a3b8" fill="none" marker-end="url(#arrow)"/>
  <text x="178" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">no</text>
  <path d="M545,168 H610 V262" stroke="#94a3b8" fill="none" marker-end="url(#arrow)"/>
  <text x="582" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">yes</text>

  <!-- no outcome -->
  <rect x="30" y="262" width="300" height="60" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="180" y="288" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1d4ed8">Exclude from coverage</text>
  <text x="180" y="308" text-anchor="middle" font-size="11.5" fill="#1d4ed8">honest: it's already covered by the e2e tests</text>

  <!-- yes outcome -->
  <rect x="430" y="262" width="300" height="60" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="580" y="288" text-anchor="middle" font-size="13.5" font-weight="600" fill="#047857">Write a real test</text>
  <text x="580" y="308" text-anchor="middle" font-size="11.5" fill="#047857">assert the behaviour someone depends on</text>

  <!-- forbidden -->
  <rect x="230" y="346" width="300" height="46" rx="10" fill="#fef2f2" stroke="#ef4444"/>
  <text x="380" y="374" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b91c1c">✗ Never a hollow test to pad the number</text>
</svg>
