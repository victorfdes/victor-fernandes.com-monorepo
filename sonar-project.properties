sonar.projectKey=victorfdes_victor-fernandes.com-monorepo
sonar.organization=victorfdes

sonar.sources=apps/website/src,packages/ui/src,packages/eslint-config
sonar.tests=apps/website/src,packages/ui/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/dist/**,**/.astro/**,**/node_modules/**,**/storybook-static/**,**/*.stories.tsx

# Coverage (generate lcov via `vitest run --coverage` in CI before scanning).
sonar.javascript.lcov.reportPaths=.sonar/coverage/website.lcov,.sonar/coverage/ui.lcov

# Files excluded from the *coverage* requirement (still analysed for bugs/smells).
# Rationale: presentational-only components validated by Playwright e2e, shared
# ESLint config (exercised by the lint run itself), barrels and Astro markup. This
# mirrors the `coverage.exclude` lists in the two vitest.config.ts files. See
# AGENTS.md "Testing & coverage" before adding to this list.
sonar.coverage.exclusions=\
  **/*.astro,\
  packages/eslint-config/**,\
  **/index.ts,\
  apps/website/src/components/HeaderBanner.tsx,\
  apps/website/src/components/VictorBanner.tsx,\
  apps/website/src/components/Testimonials.tsx,\
  apps/website/src/components/Header/**,\
  apps/website/src/components/Footer/SonarStatus.tsx,\
  apps/website/src/components/Footer/ScorecardStatus.tsx,\
  apps/website/src/components/resume/**,\
  apps/website/src/components/blog/BlogPostList.tsx,\
  apps/website/src/components/blog/TaxonomyIndex.tsx,\
  apps/website/src/components/blog/mdx-components.tsx,\
  apps/website/src/layouts/AppLayout.tsx,\
  apps/website/src/content.config.ts,\
  packages/ui/src/Flashlight/**,\
  packages/ui/src/ThemeToggle/**
